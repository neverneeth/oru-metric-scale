
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Lusitana:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="layout">
        <aside class="panel panel--camera">
            <p class="panel__eyebrow">Calibration</p>
            <p class="panel__placeholder">I might take camera input here </p>
            <div class="dpi-readout">
                <span class="dpi-readout__value" id="dpiValue">96</span>
                <span class="dpi-readout__unit">PPI</span>
                <span class="dpi-readout__source">default</span>
            </div>
        </aside>

        <section class="panel panel--scale">
            <p class="panel__eyebrow">Scale</p>
            <div class="scale-container">
                <canvas id="scaleCanvas" width="400" height="100"></canvas>
            </div>
            <div class="scale-readout">
                <span class="scale-readout__val" id="scaleValue">0</span>
                <span class="scale-readout__unit">mm</span>
            </div>
        </section>

    </main>
    <script src="scale.js"> </script>
</body>
</html>
